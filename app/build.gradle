plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.co.improvemedia.certlogic'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.co.improvemedia.certlogic'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            // Signed with the debug key so the prototype APK installs directly.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
